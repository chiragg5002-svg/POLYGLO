# Production-safe overlay for MAESTRO / POLYGLODB.
#
# This file does NOT stand alone — it's merged on top of
# docker-compose.yml (Compose overlays merge field-by-field, they
# don't replace whole services):
#
#   cp .env.docker.example .env.docker   # fill in real secrets first
#   docker compose --env-file .env.docker \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes relative to the base file:
#   - Every database requires real authentication (Mongo root user,
#     Elasticsearch's built-in `elastic` user, Redis AUTH) instead of
#     the base file's open-by-default local dev setup.
#   - Database ports are no longer published to the host at all —
#     only the `api` container can reach them, over the internal
#     Compose network. If you need host access for a one-off `psql`/
#     `mongosh` session, use `docker compose exec <service> ...`
#     instead of opening the port back up.
#   - `ports: !reset []` really removes the base file's published ports (a
#     plain `ports: []` would be MERGED with them and change nothing). This
#     needs Docker Compose >= 2.24. `!override` on the api port binds the API to
#     127.0.0.1 only, so put a TLS-terminating reverse proxy in front of it.
#   - Required secrets use ${VAR:?message}: `docker compose up` refuses to
#     start with an empty/missing value, and the API itself refuses to boot in
#     production with weak secrets (see dbaas/security.js validateStartupConfig).
#   - NODE_ENV=production (suppresses raw error detail in HTTP
#     error responses — see server.js's sendError()).
#   - Basic memory limits and an `always` restart policy, since this
#     is meant to be left running unattended.
#
# None of these values are hardcoded here either — they all read
# from .env.docker, which is gitignored. `.env.docker.example`
# documents every variable this file expects.

services:
  api:
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # The DBaaS control plane (/v1/projects) refuses to run in
      # production without an admin token — fail fast if it is missing.
      MAESTRO_ADMIN_TOKEN: ${MAESTRO_ADMIN_TOKEN:?set MAESTRO_ADMIN_TOKEN (>= 32 random chars) in .env.docker}
      MAESTRO_KEY_PEPPER: ${MAESTRO_KEY_PEPPER:?set MAESTRO_KEY_PEPPER (>= 32 random chars) in .env.docker}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
      MAESTRO_CORS_ORIGINS: ${MAESTRO_CORS_ORIGINS:-}
      MAESTRO_TRUST_PROXY: ${MAESTRO_TRUST_PROXY:-1}
      MAESTRO_LOG_LEVEL: ${MAESTRO_LOG_LEVEL:-info}
    ports: !override
      - "127.0.0.1:${PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 25s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    ports: !reset []   # do not publish 5432 to the host in production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: !reset []   # do not publish 27017 to the host in production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  elasticsearch:
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: !reset []   # do not publish 9200 to the host in production
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1200M

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: !reset []   # do not publish 6379 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
